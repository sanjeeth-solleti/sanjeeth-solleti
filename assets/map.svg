        <path d="M0 -3 L4 1 L10 -5" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="18" y="0" font-weight="600">SHA-256 Audit Hashes</text>
