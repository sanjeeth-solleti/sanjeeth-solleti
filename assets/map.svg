<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="DFIR Dual-Engine Forensic Pipeline Architecture: WFT Platform and MSTeams_Parser Synthesis">
  <defs>
