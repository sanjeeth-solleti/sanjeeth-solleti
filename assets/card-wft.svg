<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="WFT — Windows Forensic Examination Platform">
  <defs>
    <linearGradient id="wftbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wftaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
    <clipPath id="wftround"><rect width="960" height="280" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#wftround)">
    <rect width="960" height="280" fill="url(#wftbg)"/>

    <!-- Subtle accent border -->
    <rect width="960" height="280" fill="none" stroke="#30363D" stroke-width="1.5" rx="12"/>
    <rect x="0" y="0" width="6" height="280" fill="url(#wftaccent)"/>

    <!-- Header badge -->
    <rect x="40" y="26" width="180" height="22" rx="4" fill="#1F6FEB" fill-opacity="0.15" stroke="#388BFD" stroke-width="1"/>
    <text x="50" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#58A6FF" letter-spacing="1.2">FLAGSHIP DFIR SUITE</text>

    <!-- Star & status -->
    <text x="890" y="41" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7EE787">● ACTIVE WORKSTATION</text>

    <!-- Project Title -->
    <text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#F0F6FC">WFT — Windows Forensic Examination Platform</text>
    <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Enterprise DFIR processing &amp; examination workbench with zero-copy DuckDB analytics and full toolchain orchestration.</text>

    <!-- 4 Core Pillars Grid -->
    <!-- Box 1 -->
    <rect x="40" y="126" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="55" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#58A6FF">⚡ DuckDB Columnar Core</text>
    <text x="55" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Sub-millisecond queries, unified super-timeline over 500,000+ unpivoted artifacts.</text>

    <!-- Box 2 -->
    <rect x="495" y="126" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="510" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3FB950">🛠️ Eric Zimmerman CLI Pipeline</text>
    <text x="510" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Automated RLA dirty registry replay + PECmd, MFTECmd, EvtxECmd, RECmd, SBECmd.</text>

    <!-- Box 3 -->
    <rect x="40" y="194" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="55" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#D29922">🌐 Non-EZ Custom Forensic Parsers</text>
    <text x="55" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Chromium/Firefox SQLite+WAL, Teams/Discord LevelDB, OneDrive, USB correlator.</text>

    <!-- Box 4 -->
    <rect x="495" y="194" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="510" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#BC8CFF">🎯 Threat Hunting &amp; Inspection</text>
    <text x="510" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Compiled YARA-X scanner, RapidOCR text extraction, 16-byte Hex &amp; Cytoscape graph.</text>
  </g>
</svg>
