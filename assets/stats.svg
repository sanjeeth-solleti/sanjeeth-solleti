<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 78" width="1000" height="78" role="img" aria-label="Enterprise DFIR Suite · 50+ Artifact Parsers · Windows &amp; Endpoint Forensics · CEH Certified">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <clipPath id="sround"><rect width="1000" height="78" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#sround)">
    <rect width="1000" height="78" fill="url(#sbg)"/>
    <rect width="1000" height="78" fill="none" stroke="#30363D" stroke-width="1.2" rx="10"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <!-- Col 1: WFT Platform -->
      <g transform="translate(125,0)">
        <text x="0" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#58A6FF">WFT</text>
        <text x="0" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="1.6">ENTERPRISE DFIR SUITE</text>
      </g>

      <rect x="250" y="14" width="1" height="50" fill="#30363D"/>

      <!-- Col 2: Artifacts -->
      <g transform="translate(375,0)">
        <text x="0" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#3FB950">50+</text>
        <text x="0" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="1.6">ARTIFACT TYPES PARSED</text>
      </g>

      <rect x="500" y="14" width="1" height="50" fill="#30363D"/>

      <!-- Col 3: Specialization -->
      <g transform="translate(625,0)">
        <text x="0" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#D29922">DFIR</text>
        <text x="0" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="1.6">WINDOWS &amp; ENDPOINT</text>
      </g>

      <rect x="750" y="14" width="1" height="50" fill="#30363D"/>

      <!-- Col 4: Certification -->
      <g transform="translate(875,0)">
        <text x="0" y="36" text-anchor="middle" font-size="28" font-weight="700" fill="#BC8CFF">CEH</text>
        <text x="0" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#8B949E" letter-spacing="1.6">CERTIFIED ETHICAL HACKER</text>
      </g>
    </g>
  </g>
</svg>
