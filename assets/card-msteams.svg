<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="MSTeams_Parser — Microsoft Teams Forensic Suite">
  <defs>
    <linearGradient id="msbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="60%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#191528"/>
    </linearGradient>
    <linearGradient id="msaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A371F7"/>
      <stop offset="100%" stop-color="#6E40C9"/>
    </linearGradient>
    <clipPath id="msround"><rect width="960" height="280" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#msround)">
    <rect width="960" height="280" fill="url(#msbg)"/>

    <!-- Subtle accent border -->
    <rect width="960" height="280" fill="none" stroke="#30363D" stroke-width="1.5" rx="12"/>
    <rect x="0" y="0" width="6" height="280" fill="url(#msaccent)"/>

    <!-- Header badge -->
    <rect x="40" y="26" width="200" height="22" rx="4" fill="#6E40C9" fill-opacity="0.2" stroke="#A371F7" stroke-width="1"/>
    <text x="50" y="41" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#D2A8FF" letter-spacing="1.2">APPLICATION FORENSICS</text>

    <!-- Status -->
    <text x="890" y="41" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7EE787">● 100% OFFLINE / ISOLATED</text>

    <!-- Project Title -->
    <text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#F0F6FC">MSTeams_Parser — Microsoft Teams Forensic Suite</text>
    <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8B949E">Deep extraction, message normalization, contact resolution, and media carving for Microsoft Teams artifacts.</text>

    <!-- 4 Core Pillars Grid -->
    <!-- Box 1 -->
    <rect x="40" y="126" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="55" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#D2A8FF">💾 IndexedDB &amp; LevelDB Deep Ingestion</text>
    <text x="55" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Ingests New Teams (v2) and Classic Teams (v1) stores with multi-source fallback.</text>

    <!-- Box 2 -->
    <rect x="495" y="126" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="510" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#58A6FF">🧩 Adaptive Cards &amp; Message Events</text>
    <text x="510" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Decodes Base64 JSON Adaptive Cards, call durations, meeting logs, deleted messages.</text>

    <!-- Box 3 -->
    <rect x="40" y="194" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="55" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#3FB950">👤 Contact &amp; Identity Resolution</text>
    <text x="55" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Maps obfuscated GUIDs to human names, emails, roles, and enterprise directory info.</text>

    <!-- Box 4 -->
    <rect x="495" y="194" width="425" height="58" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <text x="510" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#FFA657">📊 Evidence Hand-off &amp; Reports</text>
    <text x="510" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8B949E">Standalone HTML chat viewer, Excel CSV summaries, media carving, dual UTC/IST.</text>
  </g>
</svg>
