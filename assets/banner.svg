          <path d="M5 -1 C5 -3 17 -3 17 -1 C17 1 5 1 5 -1 Z M5 3 C5 5 17 5 17 3 M5 7 C5 9 17 9 17 7" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
