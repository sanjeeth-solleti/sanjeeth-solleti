<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Vasava Sanjeeth Solleti — Digital Forensics &amp; Incident Response Analyst at TCS">
  <defs>
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="40%" stop-color="#090E1D"/>
      <stop offset="100%" stop-color="#05070E"/>
    </linearGradient>

    <radialGradient id="nebula-cyan" cx="12%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.20"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.06"/>
