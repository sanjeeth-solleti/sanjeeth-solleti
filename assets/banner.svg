          <path d="M14 -4 L9 3 H15 L11 10 L17 2 H12 Z" fill="#38BDF8"/>
          <text x="34" y="7" fill="#F1F5F9" font-weight="600">Sub-Ms Super-Timelines <tspan fill="#94A3B8" font-size="11" font-weight="400">(DuckDB Engine)</tspan></text>
