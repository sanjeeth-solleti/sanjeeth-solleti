  <text x="46" y="282" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#64748B">ACTIVE RESEARCH: Dirty Registry Recovery &#x2022; IndexedDB Forensics &#x2022; Multi-Source Attack Chronologies</text>
