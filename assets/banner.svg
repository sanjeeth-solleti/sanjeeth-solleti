<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Vasava Sanjeeth Solleti — Digital Forensics &amp; Incident Response Specialist">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="nebula-cyan" cx="12%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebula-right" cx="84%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#040711" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradients -->
    <linearGradient id="frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="top-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#0284C7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- DFIR Theme Badge Beside Name -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1D36"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radar Sweep Trail Gradient -->
    <linearGradient id="sweep-trail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.0" fill="#1E293B" fill-opacity="0.4"/>
    </pattern>

    <clipPath id="banner-clip"><rect width="1280" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <g clip-path="url(#banner-clip)">
    <!-- Canvas &amp; Atmospheric Lighting -->
    <rect width="1280" height="300" rx="16" fill="url(#bg-banner)"/>
    <rect width="1280" height="300" rx="16" fill="url(#nebula-cyan)"/>
    <rect width="1280" height="300" rx="16" fill="url(#nebula-right)"/>
    <rect width="1280" height="300" rx="16" fill="url(#dot-grid)"/>
    <rect x="0.5" y="0.5" width="1279" height="299" rx="16" fill="none" stroke="url(#frame-border)" stroke-width="1"/>

    <!-- Specular Highlight Line with Animated Sweep -->
    <line x1="24" y1="1" x2="1256" y2="1" stroke="url(#top-specular)" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="1" x2="220" y2="1" stroke="#00D2FF" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="x1" values="24;1060;24" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="220;1256;220" dur="7s" repeatCount="indefinite"/>
    </line>

    <!-- ==================== LEFT HERO COLUMN ==================== -->
    <g transform="translate(52, 28)">
      <!-- Eyebrow Organization Capsule -->
      <g>
        <rect width="320" height="26" rx="13" fill="#081426" stroke="#0284C7" stroke-width="0.75"/>
        <circle cx="14" cy="13" r="3.5" fill="#38BDF8">
          <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14" cy="13" r="3.5" fill="none" stroke="#38BDF8" stroke-width="1">
          <animate attributeName="r" values="3.5;10" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="26" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">TATA CONSULTANCY SERVICES <tspan fill="#475569" font-weight="400">|</tspan> <tspan fill="#94A3B8" font-weight="600">DFIR</tspan></text>
      </g>

      <!-- Hero Name Row + Prominent DFIR Theme Beside Name -->
      <g transform="translate(0, 78)">
        <text x="0" y="0" class="font-sans" font-size="44" font-weight="800" fill="url(#name-grad)" letter-spacing="-0.5">Vasava Sanjeeth Solleti</text>
        
        <!-- ================= DFIR THEME BESIDE NAME ================= -->
        <g transform="translate(516, -30)">
          <!-- Glowing Badge Shell -->
          <rect width="224" height="36" rx="18" fill="url(#badge-grad)" stroke="url(#badge-border)" stroke-width="1.2"/>
          
          <!-- Animated Border Specular Highlight Streak -->
          <line x1="16" y1="1" x2="60" y2="1" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round">
            <animate attributeName="x1" values="16;160;16" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="x2" values="60;208;60" dur="3s" repeatCount="indefinite"/>
          </line>

          <!-- Live Telemetry Radar Blip Dot -->
          <circle cx="18" cy="18" r="4" fill="#00D2FF">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <circle cx="18" cy="18" r="4" fill="none" stroke="#00D2FF" stroke-width="1">
            <animate attributeName="r" values="4;12" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
          </circle>

          <!-- Cyber Forensics Shield Icon -->
          <g transform="translate(34, 9)">
            <path d="M9 1 L17 4 V9 C17 14 13 17 9 18 C5 17 1 14 1 9 V4 Z" fill="#0A2244" stroke="#38BDF8" stroke-width="1.3"/>
            <!-- Magnifying glass / forensic reticle inside shield -->
            <path d="M5.5 8.5 L8 11 L13 6" fill="none" stroke="#00D2FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

          <!-- DFIR Theme Typography -->
          <text x="58" y="22" class="font-mono" font-size="11.5" font-weight="800" fill="#FFFFFF" letter-spacing="1">DFIR</text>
          <text x="96" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">SPECIALIST</text>

          <!-- Status Indicator Pill -->
          <rect x="174" y="9" width="40" height="18" rx="9" fill="#08203E" stroke="#0284C7" stroke-width="0.6"/>
          <text x="194" y="21.5" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="800" fill="#93C5FD">ACTIVE</text>
        </g>
      </g>

      <!-- Role & Specialization -->
      <text x="0" y="112" class="font-sans" font-size="17" font-weight="700" fill="#F8FAFC">
        Digital Forensics &amp; Incident Response Specialist
      </text>

      <text x="0" y="136" class="font-sans" font-size="13.5" font-weight="500" fill="#94A3B8">
        Windows Endpoint Telemetry <tspan fill="#475569">&#x2022;</tspan> Cloud Collaboration Forensics <tspan fill="#475569">&#x2022;</tspan> High-Throughput Engines
      </text>

      <text x="0" y="160" class="font-sans" font-size="12" fill="#64748B">
        Deterministic artifact reconstruction across raw disk VFS, dirty registry replay, &amp; IndexedDB stores.
      </text>

      <!-- Credential & Tech Chips Row -->
      <g transform="translate(0, 180)">
        <g transform="translate(0, 0)">
          <rect width="128" height="26" rx="13" fill="#081426" stroke="#0284C7" stroke-width="0.75"/>
          <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
          <text x="22" y="17" class="font-mono" font-size="10" font-weight="700" fill="#BAE6FD">Hyderabad, IN</text>
        </g>

        <g transform="translate(136, 0)">
          <rect width="138" height="26" rx="13" fill="#081426" stroke="#0284C7" stroke-width="0.75"/>
          <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
          <text x="22" y="17" class="font-mono" font-size="10" font-weight="700" fill="#BAE6FD">CEH v12 Certified</text>
        </g>

        <g transform="translate(282, 0)">
          <rect width="144" height="26" rx="13" fill="#081426" stroke="#0284C7" stroke-width="0.75"/>
          <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
          <text x="22" y="17" class="font-mono" font-size="10" font-weight="700" fill="#BAE6FD">dissect VFS &amp; RLA</text>
        </g>

        <g transform="translate(434, 0)">
          <rect width="122" height="26" rx="13" fill="#081426" stroke="#0284C7" stroke-width="0.75"/>
          <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
          <text x="22" y="17" class="font-mono" font-size="10" font-weight="700" fill="#BAE6FD">DuckDB Core</text>
        </g>
      </g>
    </g>

    <!-- ==================== OPEN-AIR FLOATING FORENSIC RADAR & TELEMETRY (NO BOX/WINDOW) ==================== -->
    <g transform="translate(860, 36)">
      <!-- Radar Scope Circles (Borderless, Floating Seamlessly on Dark Nebula) -->
      <circle cx="160" cy="100" r="90" fill="#061224" fill-opacity="0.4" stroke="#1E3A8A" stroke-width="0.8" stroke-dasharray="3 3"/>
      <circle cx="160" cy="100" r="62" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="160" cy="100" r="32" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4"/>

      <!-- Crosshairs -->
      <line x1="70" y1="100" x2="250" y2="100" stroke="#1E293B" stroke-width="0.8"/>
      <line x1="160" y1="10" x2="160" y2="190" stroke="#1E293B" stroke-width="0.8"/>

      <!-- ROTATING RADAR SWEEP BEAM -->
      <g>
        <line x1="160" y1="100" x2="160" y2="10" stroke="#00D2FF" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M160 100 L160 10 A90 90 0 0 1 224 36 Z" fill="url(#sweep-trail)" opacity="0.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 160 100" to="360 160 100" dur="4s" repeatCount="indefinite"/>
      </g>

      <!-- Center Radar Core -->
      <circle cx="160" cy="100" r="4" fill="#00D2FF"/>
      <circle cx="160" cy="100" r="4" fill="none" stroke="#00D2FF" stroke-width="1">
        <animate attributeName="r" values="4;16" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- FORENSIC EVIDENCE BLIPS -->
      <!-- Blip 1: E01 / VFS -->
      <circle cx="210" cy="65" r="3" fill="#38BDF8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="210" cy="65" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8">
        <animate attributeName="r" values="3;9" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="216" y="63" class="font-mono" font-size="8" font-weight="700" fill="#93C5FD">E01 VFS</text>

      <!-- Blip 2: RLA Hive Replay -->
      <circle cx="112" cy="132" r="3" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="112" cy="132" r="3" fill="none" stroke="#38BDF8" stroke-width="0.8">
        <animate attributeName="r" values="3;9" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="76" y="146" class="font-mono" font-size="8" font-weight="700" fill="#93C5FD">RLA REPLAY</text>

      <!-- Blip 3: LevelDB -->
      <circle cx="204" cy="142" r="2.5" fill="#38BDF8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="156" class="font-mono" font-size="8" font-weight="700" fill="#93C5FD">LEVELDB</text>

      <!-- Blip 4: DuckDB -->
      <circle cx="125" cy="62" r="2.5" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="96" y="56" class="font-mono" font-size="8" font-weight="700" fill="#93C5FD">DUCKDB</text>

      <!-- Floating Oscilloscope Signal Waveform with Animated Traveling Heartbeat -->
      <g transform="translate(10, 198)">
        <text x="0" y="3" class="font-mono" font-size="8" font-weight="700" fill="#475569">CASING: <tspan fill="#38BDF8">INCIDENT RESPONSE // TCS DFIR</tspan></text>
        <path fill="none" stroke="#00D2FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <animate attributeName="d"
            values="M 210 0 L 225 0 L 228 -6 L 232 6 L 236 -9 L 240 9 L 244 -4 L 248 4 L 252 0 L 305 0;M 210 0 L 240 0 L 243 -6 L 247 6 L 251 -9 L 255 9 L 259 -4 L 263 4 L 267 0 L 305 0;M 210 0 L 260 0 L 263 -6 L 267 6 L 271 -9 L 275 9 L 279 -4 L 283 4 L 287 0 L 305 0;M 210 0 L 225 0 L 228 -6 L 232 6 L 236 -9 L 240 9 L 244 -4 L 248 4 L 252 0 L 305 0"
            dur="3.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- ==================== BANNER FOOTER TELEMETRY BAR ==================== -->
    <line x1="52" y1="262" x2="1228" y2="262" stroke="#1E293B" stroke-width="0.8"/>
    <g transform="translate(52, 284)">
      <circle cx="4" cy="-3" r="3.5" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="500" fill="#94A3B8">
        ACTIVE RESEARCH: <tspan fill="#E2E8F0">Dirty Registry Replay</tspan> &#x2022; <tspan fill="#E2E8F0">IndexedDB Messaging Stores</tspan> &#x2022; <tspan fill="#E2E8F0">Sub-Millisecond Super-Timelines</tspan>
      </text>
      <text x="1176" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8">
        OPEN SOURCE DFIR ENGINES
      </text>
    </g>
  </g>
</svg>