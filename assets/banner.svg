  <text x="46" y="280" font-family="'Segoe UI', sans-serif" font-size="10.5" fill="#94A3B8">ACTIVE RESEARCH: Dirty Registry Replay &#x2022; IndexedDB Forensics &#x2022; Multi-Source Attack Chronologies</text>
