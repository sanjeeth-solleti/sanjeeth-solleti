<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Vasava Sanjeeth Solleti — Digital Forensics and Incident Response">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#388BFD"/>
      <stop offset="50%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>

    <!-- faint forensic grid -->
    <g stroke="#161B22" stroke-width="1">
      <path d="M0 65H1000M0 130H1000M0 195H1000"/>
      <path d="M200 0V260M400 0V260M600 0V260M800 0V260"/>
    </g>

    <!-- hex dump motif: NTFS $MFT FILE0 + PE Headers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#28323D">
      <text x="575" y="46">00000000  <tspan fill="#388BFD" opacity="0.9">46 49 4C 45</tspan> 30 00 03 00  <tspan fill="#388BFD" opacity="0.9">FILE0</tspan>...</text>
      <text x="575" y="68">00000010  01 00 00 00 38 00 01 00  ....8...</text>
      <text x="575" y="90">00000020  00 04 00 00 00 01 00 00  ........</text>
      <text x="575" y="112">00000030  10 00 00 00 60 00 00 00  ....`... ($SI)</text>
      <text x="575" y="134">00000040  30 00 00 00 78 00 00 00  0...x... ($FN)</text>
      <text x="575" y="156">00000050  <tspan fill="#2EA043" opacity="0.9">4D 5A</tspan> 90 00 03 00 00 00  <tspan fill="#2EA043" opacity="0.9">MZ</tspan>...... (PE)</text>
      <text x="575" y="178">00000078  <tspan fill="#2EA043" opacity="0.9">50 45 00 00</tspan> 64 86 07 00  <tspan fill="#2EA043" opacity="0.9">PE</tspan>..d... </text>
      <text x="575" y="200">00000088  53 45 43 55 52 49 54 59  SECURITY</text>
      <text x="575" y="222">00000098  72 65 67 69 73 74 72 79  registry</text>
    </g>

    <!-- fade hex dump toward text on the left -->
    <rect x="490" y="0" width="160" height="260" fill="url(#fade)"/>

    <!-- glowing left accent bar -->
    <rect x="0" y="0" width="6" height="260" fill="url(#edge)"/>

    <!-- terminal prompt -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="48" y="56" fill="#2EA043">$</text>
      <text x="66" y="56" fill="#8B949E">whoami --role dfir --verbose</text>
    </g>

    <!-- Name -->
    <text x="46" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="36" font-weight="700" fill="#F0F6FC" letter-spacing="0.5">VASAVA SANJEETH SOLLETI</text>

    <!-- Role -->
    <text x="48" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="15.5" font-weight="600" fill="#388BFD" letter-spacing="3.2">DIGITAL FORENSICS &amp; INCIDENT RESPONSE</text>

    <!-- Divider rule -->
    <rect x="48" y="168" width="460" height="1" fill="#21262D"/>

    <!-- Meta / Credentials -->
    <text x="48" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" fill="#8B949E">CEH Certified  ·  DFIR Analyst  ·  Windows Forensics Architect  ·  Hyderabad, India</text>

    <!-- Tagline & blinking terminal cursor -->
    <text x="48" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12.5" fill="#6E7681">acquire · validate · correlate · reconstruct<tspan fill="#2EA043" dx="8">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <!-- border -->
    <rect width="1000" height="260" rx="14" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
